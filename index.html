<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="heading">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input placeholder="Enter digit here" type = "string" id="input-digit" value = "">
            <button id="convert-btn">Convert</button>
        </div>
        <div class="conversion">
            <h2>Length (Meter/Feet)</h2>
            <p id="length-conversion">Enter digit first</p>
        </div>
        <div class="conversion">
            <h2>Volume (Liters/Gallons)</h2>
            <p id="volume-conversion">Enter digit first</p>
        </div>
        <div class="conversion">
            <h2>Mass (Kilograms/Pounds)</h2>
            <p id="mass-conversion">Enter digit first</p>
        </div>
    </body>
    <script src="unitconvertor.js"></script>
</html>
